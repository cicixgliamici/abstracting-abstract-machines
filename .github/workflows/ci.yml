name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# Validation needs repository reads only, including for pull requests from forks.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A successful run must not depend on restored Dune build artifacts.
      DUNE_CACHE: disabled
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up the review compiler
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: "ocaml-base-compiler.4.14.1"
          # Install from the package file explicitly, as in the local instructions.
          opam-pin: false
          cache: false

      - name: Install declared dependencies
        run: |
          opam lint abstracting_abstract_machines.opam
          opam install . --deps-only --with-test --yes

      - name: Show toolchain versions
        run: |
          opam --version
          opam exec -- ocamlc -version
          opam exec -- dune --version

      - name: Build from clean output
        run: |
          opam exec -- dune clean
          opam exec -- dune build @all

      - name: Run all tests
        run: opam exec -- dune runtest --force
